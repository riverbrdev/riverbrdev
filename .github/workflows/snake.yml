name: Snake

# Regenerates the contribution-snake animation once a day and publishes it to
# the `output` branch. The profile README links to the files on that branch.

on:
  schedule:
    - cron: "0 0 * * *"   # daily, 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # push the generated SVGs to the output branch

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Snake colors match the radar banner (mint on dark, green on light).
          outputs: |
            dist/github-snake.svg?color_snake=#00a37f
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#42e1b3

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
