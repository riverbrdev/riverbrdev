  <circle class="hand back" cx="548" cy="235" r="7" fill="#A86B35"/>

  <!-- Torso: hoodie with a curved back and the hood resting behind the neck -->
  <path d="M400 202 C382 230 384 278 392 300 L468 300 C470 262 468 228 460 210 C450 196 424 192 400 202 Z" fill="#4b5bd6"/>
  <path d="M396 206 C392 194 404 184 418 186 L424 196 C412 196 404 200 400 210 Z" fill="#3a47ad"/>
  <path d="M452 214 C460 240 462 270 462 298" fill="none" stroke="#5d6ce0" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  <rect x="424" y="172" width="20" height="26" rx="7" fill="#A86B35"/>

  <!-- Head and face (facing right) -->
  <circle cx="436" cy="152" r="27" fill="#C68642"/>
  <path d="M460 149 Q470 156 461 161" fill="#C68642"/>
  <circle class="eye" cx="451" cy="151" r="2.8" fill="#2B1B14"/>
  <path d="M446 144 Q452 141 458 144" fill="none" stroke="#2B1B14" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M451 167 Q456 170 460 166" fill="none" stroke="#A86B35" stroke-width="2" stroke-linecap="round"/>
  <g clip-path="url(#hairClip)"><circle cx="432" cy="144" r="27" fill="#2B1B14"/><circle cx="412.8" cy="167.7" r="11" fill="#2B1B14"/><circle cx="409.5" cy="161.1" r="11" fill="#2B1B14"/><circle cx="408.1" cy="154.0" r="11" fill="#2B1B14"/><circle cx="408.5" cy="146.7" r="13" fill="#2B1B14"/><circle cx="410.8" cy="139.7" r="13" fill="#2B1B14"/><circle cx="414.9" cy="133.6" r="13" fill="#2B1B14"/><circle cx="420.3" cy="128.8" r="13" fill="#2B1B14"/><circle cx="426.9" cy="125.5" r="13" fill="#2B1B14"/><circle cx="434.0" cy="124.1" r="13" fill="#2B1B14"/><circle cx="441.3" cy="124.5" r="13" fill="#2B1B14"/><circle cx="448.3" cy="126.8" r="13" fill="#2B1B14"/><circle cx="454.4" cy="130.9" r="11" fill="#2B1B14"/><circle cx="455.9" cy="138.6" r="11" fill="#2B1B14"/><path d="M407.8 167.7 a5.0 5.0 0 1 0 9.9 0" fill="none" stroke="#4a3328" stroke-width="1.6" stroke-linecap="round"/><path d="M404.6 161.1 a5.0 5.0 0 1 1 9.9 0" fill="none" stroke="#4a3328" stroke-width="1.6" stroke-linecap="round"/><path d="M403.1 154.0 a5.0 5.0 0 1 0 9.9 0" fill="none" stroke="#4a3328" stroke-width="1.6" stroke-linecap="round"/><path d="M402.7 146.7 a5.9 5.9 0 1 1 11.7 0" fill="none" stroke="#4a3328" stroke-width="1.6" stroke-linecap="round"/><path d="M405.0 139.7 a5.9 5.9 0 1 0 11.7 0" fill="none" stroke="#4a3328" stroke-width="1.6" stroke-linecap="round"/><path d="M409.0 133.6 a5.9 5.9 0 1 1 11.7 0" fill="none" stroke="#4a3328" stroke-width="1.6" stroke-linecap="round"/><path d="M414.5 128.8 a5.9 5.9 0 1 0 11.7 0" fill="none" stroke="#4a3328" stroke-width="1.6" stroke-linecap="round"/><path d="M421.0 125.5 a5.9 5.9 0 1 1 11.7 0" fill="none" stroke="#4a3328" stroke-width="1.6" stroke-linecap="round"/><path d="M428.2 124.1 a5.9 5.9 0 1 0 11.7 0" fill="none" stroke="#4a3328" stroke-width="1.6" stroke-linecap="round"/><path d="M435.5 124.5 a5.9 5.9 0 1 1 11.7 0" fill="none" stroke="#4a3328" stroke-width="1.6" stroke-linecap="round"/><path d="M442.4 126.8 a5.9 5.9 0 1 0 11.7 0" fill="none" stroke="#4a3328" stroke-width="1.6" stroke-linecap="round"/><path d="M449.4 130.9 a5.0 5.0 0 1 1 9.9 0" fill="none" stroke="#4a3328" stroke-width="1.6" stroke-linecap="round"/><path d="M450.9 138.6 a5.0 5.0 0 1 0 9.9 0" fill="none" stroke="#4a3328" stroke-width="1.6" stroke-linecap="round"/></g>
  <ellipse cx="429" cy="158" rx="4.5" ry="6.5" fill="#A86B35"/>

  <!-- Front arm, typing -->
  <path d="M436 214 L462 264 L530 240" fill="none" stroke="#4b5bd6" stroke-width="15" stroke-linejoin="round" stroke-linecap="round"/>
  <circle class="hand" cx="536" cy="238" r="7.5" fill="#C68642"/>

  <!-- Thought bubble with the idea -->
  <g class="bubble">
    <circle cx="474" cy="114" r="4" fill="#232838" stroke="#3a4152"/>
    <circle cx="487" cy="99" r="6.5" fill="#232838" stroke="#3a4152"/>
    <path d="M497 80 Q487 56 512 50 Q522 30 547 39 Q570 31 578 54 Q597 62 584 81 Q578 94 556 89 Q537 98 519 89 Q497 92 497 80 Z" fill="#232838" stroke="#3a4152" stroke-width="1.5"/>
    <circle class="bulb-on" cx="539" cy="62" r="24" fill="url(#glow)"/>
    <circle cx="539" cy="58" r="10" fill="#8A92A6" fill-opacity=".35"/>
    <circle class="bulb-on" cx="539" cy="58" r="10" fill="#ffd27a"/>
    <rect x="534" y="67" width="10" height="8" rx="2" fill="#8A92A6"/>
    <g class="bulb-on" stroke="#ffd27a" stroke-width="2" stroke-linecap="round">
      <line x1="539" y1="40" x2="539" y2="44"/><line x1="523" y1="47" x2="526" y2="50"/><line x1="555" y1="47" x2="552" y2="50"/>
    </g>
  </g>

  <!-- Desk and keyboard -->
  <rect x="592" y="250" width="12" height="122" fill="#20252f"/>
  <rect x="952" y="250" width="12" height="122" fill="#20252f"/>
  <rect x="470" y="240" width="510" height="10" rx="3" fill="#2a3142"/>
  <rect x="470" y="240" width="510" height="3" rx="1.5" fill="#343c50"/>
  <rect x="528" y="233" width="88" height="7" rx="2" fill="#232838"/>

  <!-- Claude Code, hiding behind the monitor until it pops up -->
  <g class="claude">
    <rect x="788" y="68" width="8" height="8" fill="#D97757"/>
    <rect x="840" y="68" width="8" height="8" fill="#D97757"/>
    <rect x="796" y="56" width="44" height="32" fill="#D97757"/>
    <rect x="806" y="64" width="5" height="9" fill="#1a1a1a"/>
    <rect x="825" y="64" width="5" height="9" fill="#1a1a1a"/>
  </g>
  <path class="spark s1" d="M778 47 Q778 54 785 54 Q778 54 778 61 Q778 54 771 54 Q778 54 778 47 Z" fill="#ffb960"/>
  <path class="spark s2" d="M860 40 Q860 46 866 46 Q860 46 860 52 Q860 46 854 46 Q860 46 860 40 Z" fill="#ffb960"/>
  <path class="spark s3" d="M854 65.5 Q854 70 858.5 70 Q854 70 854 74.5 Q854 70 849.5 70 Q854 70 854 65.5 Z" fill="#ffb960"/>

  <!-- Monitor -->
  <rect x="730" y="210" width="20" height="24" fill="#2a3142"/>
  <rect x="702" y="232" width="76" height="8" rx="3" fill="#2a3142"/>
  <rect x="620" y="86" width="240" height="124" rx="10" fill="#232838"/>
  <rect x="630" y="96" width="220" height="104" rx="4" fill="#0b0d13"/>
  <g clip-path="url(#screen)">
    <circle cx="642" cy="105" r="2.5" fill="#FF6B7D"/><circle cx="651" cy="105" r="2.5" fill="#ffb960"/><circle cx="660" cy="105" r="2.5" fill="#42e1b3"/>
    <rect class="code c0" x="644" y="116" width="96" height="5" rx="2.5" fill="#b7c4ff"/>
    <rect class="code c1" x="656" y="126" width="120" height="5" rx="2.5" fill="#42e1b3"/>
    <rect class="code c2" x="656" y="136" width="76" height="5" rx="2.5" fill="#4a5266"/>
    <rect class="code c3" x="668" y="146" width="106" height="5" rx="2.5" fill="#ffb960"/>
    <rect class="code c4" x="656" y="156" width="56" height="5" rx="2.5" fill="#42e1b3"/>
    <rect class="code c5" x="656" y="166" width="128" height="5" rx="2.5" fill="#D97757"/>
    <rect class="code c6" x="668" y="176" width="94" height="5" rx="2.5" fill="#D97757"/>
    <rect class="code c7" x="644" y="186" width="66" height="5" rx="2.5" fill="#D97757"/>
    <text class="ship-label" x="816" y="189" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#42e1b3">shipped</text>
    <g class="ship">
      <circle cx="832" cy="185" r="10.5" fill="#42e1b3"/>
      <path d="M827 185 l3.5 3.5 l7 -8" fill="none" stroke="#0b0d13" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  </g>
</svg>
