<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" width="840" height="390" role="img" aria-labelledby="stitle sdesc">
  <title id="stitle">How I build</title>
  <desc id="sdesc">A developer with curly hair gets an idea, writes code, Claude Code pops up over the monitor to help, and the work ships.</desc>
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1117"/>
      <stop offset="1" stop-color="#171A23"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screen"><rect x="630" y="96" width="220" height="104" rx="4"/></clipPath>
    <clipPath id="hairClip"><path d="M376 82 L486 82 L486 139 L454 139 Q438 141 432 152 L429 176 L376 176 Z"/></clipPath>
  </defs>
  <style>
    .hand { animation: type .32s ease-in-out infinite alternate; }
    .hand.back { animation-delay: -.16s; }
    @keyframes type { to { transform: translateY(-3px); } }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
    @keyframes blink { 0%, 95% { transform: scaleY(1); } 97% { transform: scaleY(.1); } 100% { transform: scaleY(1); } }
    .bubble { transform-box: fill-box; transform-origin: 0% 100%; animation: bubble 12.0s ease-out infinite; }
    @keyframes bubble { 0%, 7% { opacity: 0; transform: scale(.6); } 11% { opacity: 1; transform: scale(1); } 40% { opacity: 1; transform: scale(1); } 46%, 100% { opacity: 0; transform: scale(.9); } }
    .bulb-on { animation: bulb 12.0s ease-out infinite; }
    @keyframes bulb { 0%, 13% { opacity: 0; } 16% { opacity: 1; } 40% { opacity: 1; } 46%, 100% { opacity: 0; } }
    .code { transform-box: fill-box; transform-origin: 0% 50%; }
    @keyframes c0 { 0%, 20.00% { transform: scaleX(0); opacity: 1; } 23.00% { transform: scaleX(1); opacity: 1; } 86% { transform: scaleX(1); opacity: 1; } 91% { transform: scaleX(1); opacity: 0; } 100% { transform: scaleX(0); opacity: 0; } }
    .c0 { animation: c0 12.0s linear infinite; }
    @keyframes c1 { 0%, 24.00% { transform: scaleX(0); opacity: 1; } 27.00% { transform: scaleX(1); opacity: 1; } 86% { transform: scaleX(1); opacity: 1; } 91% { transform: scaleX(1); opacity: 0; } 100% { transform: scaleX(0); opacity: 0; } }
    .c1 { animation: c1 12.0s linear infinite; }
    @keyframes c2 { 0%, 28.00% { transform: scaleX(0); opacity: 1; } 31.00% { transform: scaleX(1); opacity: 1; } 86% { transform: scaleX(1); opacity: 1; } 91% { transform: scaleX(1); opacity: 0; } 100% { transform: scaleX(0); opacity: 0; } }
    .c2 { animation: c2 12.0s linear infinite; }
    @keyframes c3 { 0%, 32.00% { transform: scaleX(0); opacity: 1; } 35.00% { transform: scaleX(1); opacity: 1; } 86% { transform: scaleX(1); opacity: 1; } 91% { transform: scaleX(1); opacity: 0; } 100% { transform: scaleX(0); opacity: 0; } }
    .c3 { animation: c3 12.0s linear infinite; }
    @keyframes c4 { 0%, 36.00% { transform: scaleX(0); opacity: 1; } 39.00% { transform: scaleX(1); opacity: 1; } 86% { transform: scaleX(1); opacity: 1; } 91% { transform: scaleX(1); opacity: 0; } 100% { transform: scaleX(0); opacity: 0; } }
    .c4 { animation: c4 12.0s linear infinite; }
    @keyframes c5 { 0%, 55.00% { transform: scaleX(0); opacity: 1; } 56.20% { transform: scaleX(1); opacity: 1; } 86% { transform: scaleX(1); opacity: 1; } 91% { transform: scaleX(1); opacity: 0; } 100% { transform: scaleX(0); opacity: 0; } }
    .c5 { animation: c5 12.0s linear infinite; }
    @keyframes c6 { 0%, 57.00% { transform: scaleX(0); opacity: 1; } 58.20% { transform: scaleX(1); opacity: 1; } 86% { transform: scaleX(1); opacity: 1; } 91% { transform: scaleX(1); opacity: 0; } 100% { transform: scaleX(0); opacity: 0; } }
    .c6 { animation: c6 12.0s linear infinite; }
    @keyframes c7 { 0%, 59.00% { transform: scaleX(0); opacity: 1; } 60.20% { transform: scaleX(1); opacity: 1; } 86% { transform: scaleX(1); opacity: 1; } 91% { transform: scaleX(1); opacity: 0; } 100% { transform: scaleX(0); opacity: 0; } }
    .c7 { animation: c7 12.0s linear infinite; }
    .claude { animation: claude 12.0s ease-out infinite; }
    @keyframes claude { 0%, 47% { transform: translateY(40px); } 50% { transform: translateY(-7px); } 52% { transform: translateY(0); }
      62% { transform: translateY(0); } 63.5% { transform: translateY(-5px); } 65% { transform: translateY(0); }
      86% { transform: translateY(0); } 91%, 100% { transform: translateY(40px); } }
    .spark { transform-box: fill-box; transform-origin: center; animation: spark 12.0s ease-out infinite; }
    .spark.s2 { animation-name: spark2; }
    .spark.s3 { animation-name: spark3; }
    @keyframes spark { 0%, 50% { opacity: 0; transform: scale(.2); } 53% { opacity: 1; transform: scale(1); } 60%, 100% { opacity: 0; transform: scale(1.3); } }
    @keyframes spark2 { 0%, 52% { opacity: 0; transform: scale(.2); } 55% { opacity: 1; transform: scale(1); } 62%, 100% { opacity: 0; transform: scale(1.3); } }
    @keyframes spark3 { 0%, 54% { opacity: 0; transform: scale(.2); } 57% { opacity: 1; transform: scale(1); } 64%, 100% { opacity: 0; transform: scale(1.3); } }
    .ship { transform-box: fill-box; transform-origin: center; animation: ship 12.0s ease-out infinite; }
    @keyframes ship { 0%, 64% { opacity: 0; transform: scale(0); } 67.5% { opacity: 1; transform: scale(1.15); } 70% { opacity: 1; transform: scale(1); } 86% { opacity: 1; transform: scale(1); } 91%, 100% { opacity: 0; transform: scale(1); } }
    .ship-label { animation: shiplabel 12.0s ease-out infinite; }
    @keyframes shiplabel { 0%, 67% { opacity: 0; } 71% { opacity: 1; } 86% { opacity: 1; } 91%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect x="0.5" y="0.5" width="839" height="389" rx="16" fill="url(#sbg)" stroke="#262B38"/>

  <g transform="translate(-250 -10)">
  <line x1="300" y1="372" x2="1040" y2="372" stroke="#232838" stroke-width="2" stroke-linecap="round"/>

  <!-- Chair -->
  <rect x="350" y="204" width="13" height="99" rx="6" fill="#2c3344"/>
  <rect x="352" y="296" width="100" height="11" rx="5" fill="#2c3344"/>
  <rect x="396" y="306" width="9" height="56" fill="#2c3344"/>
  <rect x="368" y="358" width="64" height="7" rx="3.5" fill="#2c3344"/>

  <!-- Legs -->
  <path d="M402 298 L514 298 L518 360" fill="none" stroke="#262c3a" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M506 370 L506 362 Q506 356 514 356 L534 358 Q542 360 542 366 L542 370 Z" fill="#151922"/>

  <!-- Back arm, behind the torso -->
