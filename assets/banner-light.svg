    <rect x="614" y="98" width="72" height="28" rx="14" fill="#FFFFFF" stroke="#C9D1DD" stroke-width="1.2"/><text x="650" y="116.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5B6678">models</text><rect x="614" y="166" width="72" height="28" rx="14" fill="#FFFFFF" stroke="#C9D1DD" stroke-width="1.2"/><text x="650" y="184.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5B6678">APIs</text><rect x="614" y="234" width="72" height="28" rx="14" fill="#FFFFFF" stroke="#C9D1DD" stroke-width="1.2"/><text x="650" y="252.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#5B6678">data</text>
    <path class="packet in" pathLength="100" d="M686.0 112.0 Q736.1 127.7 776.8 161.0" fill="none" stroke="#3554c6" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" style="animation-delay:-7.20s"/><path class="packet in" pathLength="100" d="M686.0 112.0 Q736.1 127.7 776.8 161.0" fill="none" stroke="#3554c6" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" style="animation-delay:-1.80s"/><path class="packet in" pathLength="100" d="M686.0 180.0 Q729.0 180.0 772.0 180.0" fill="none" stroke="#3554c6" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" style="animation-delay:-5.40s"/><path class="packet in" pathLength="100" d="M686.0 180.0 Q729.0 180.0 772.0 180.0" fill="none" stroke="#3554c6" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" style="animation-delay:-1.80s"/><path class="packet in" pathLength="100" d="M686.0 248.0 Q736.1 232.3 776.8 199.0" fill="none" stroke="#3554c6" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" style="animation-delay:-3.60s"/><path class="packet in" pathLength="100" d="M686.0 248.0 Q736.1 232.3 776.8 199.0" fill="none" stroke="#3554c6" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" style="animation-delay:-1.80s"/><path class="packet out" pathLength="100" d="M844.0 156.0 Q884.5 99.5 950.2 76.6" fill="none" stroke="#00a37f" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" style="animation-delay:-6.57s"/><path class="packet out" pathLength="100" d="M851.1 171.4 Q909.9 151.2 971.7 144.7" fill="none" stroke="#c47700" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" style="animation-delay:-4.77s"/><path class="packet out" pathLength="100" d="M851.1 188.6 Q909.9 208.8 971.7 215.3" fill="none" stroke="#4F46E5" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" style="animation-delay:-2.97s"/><path class="packet out" pathLength="100" d="M844.0 204.0 Q884.5 260.5 950.2 283.4" fill="none" stroke="#3554c6" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" style="animation-delay:-1.17s"/>
    <polygon class="hub-pulse" points="812.0,146.0 841.4,163.0 841.4,197.0 812.0,214.0 782.6,197.0 782.6,163.0" fill="none" stroke="#3554c6" stroke-width="2"/>
    <polygon points="812.0,146.0 841.4,163.0 841.4,197.0 812.0,214.0 782.6,197.0 782.6,163.0" fill="#FFFFFF" stroke="#3554c6" stroke-width="2"/>
    <polygon points="812.0,167.0 823.3,173.5 823.3,186.5 812.0,193.0 800.7,186.5 800.7,173.5" fill="#3554c6"/>
    <text x="812" y="250" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#5B6678">orchestrator</text>
