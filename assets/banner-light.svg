<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Bernardo Rios Tapia</title>
  <desc id="desc">Backend, data and AI agent systems. Models, APIs and data flow into an orchestrator that ships them to AI Radar, Mundial 2026, NotarTrack and the next idea, still taking shape.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EDF1F7"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#DCE2EA"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="360" fill="url(#fade)"/></mask>
    <!-- userSpaceOnUse: a horizontal path has a zero-height bounding box, which
         would collapse a bbox-relative filter region and hide the packet. -->
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="360">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComponentTransfer in="blur" result="soft"><feFuncA type="linear" slope=".45"/></feComponentTransfer>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .packet { stroke-dasharray: 10 200; stroke-dashoffset: 10; }
    .packet.in { animation: flowIn 7.2s linear infinite; }
    .packet.out { animation: flowOut 7.2s linear infinite; }
    @keyframes flowIn { 0% { stroke-dashoffset: 10; } 8.8% { stroke-dashoffset: -100; } 100% { stroke-dashoffset: -100; } }
    @keyframes flowOut { 0% { stroke-dashoffset: 10; } 10.0% { stroke-dashoffset: -100; } 100% { stroke-dashoffset: -100; } }
    .ring { opacity: 0; transform-box: fill-box; transform-origin: center; animation: arrive 7.2s ease-out infinite; }
    @keyframes arrive { 0%, 9.5% { opacity: 0; transform: scale(1); } 10.5% { opacity: .95; transform: scale(1); } 32.0% { opacity: 0; transform: scale(1.8); } 100% { opacity: 0; transform: scale(1.8); } }
    .hub-pulse { opacity: 0; transform-box: fill-box; transform-origin: center; animation: emit 1.8s ease-out infinite; animation-delay: -1.17s; }
    @keyframes emit { 0% { opacity: .85; transform: scale(1); } 60% { opacity: 0; transform: scale(1.5); } 100% { opacity: 0; transform: scale(1.5); } }
    .mini-sweep { animation: spin 3s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .idea { opacity: .4; animation: materialize 7.2s ease-out infinite; }
    @keyframes materialize { 0%, 9.5% { opacity: .4; } 10.5% { opacity: 1; } 55.0% { opacity: 1; } 72.0% { opacity: .4; } 100% { opacity: .4; } }
    .idea-ring { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
    .reveal { animation: reveal .9s ease-out backwards; }
    @keyframes reveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .packet, .ring, .hub-pulse { animation: none; display: none; }
      .mini-sweep, .reveal, .idea-ring { animation: none; }
      .idea { animation: none; opacity: .85; }
    }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="url(#bg)" stroke="#D5DCE6"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#grid)" mask="url(#gridMask)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text class="reveal" x="72" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#4F46E5" style="animation-delay:.1s">~/riverbrdev</text>
    <text class="reveal" x="72" y="178" font-size="54" font-weight="700" letter-spacing="-1" fill="#0F1117" style="animation-delay:.25s">Bernardo Rios Tapia</text>
    <text class="reveal" x="72" y="222" font-size="23" font-weight="600" fill="#007a5e" style="animation-delay:.45s">Backend, data and AI agent systems</text>
    <text class="reveal" x="72" y="258" font-size="17" fill="#5B6678" style="animation-delay:.6s">Systems Engineering student in Cochabamba, Bolivia</text>
  </g>

