<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">Bernardo Rios Tapia</title>
  <desc id="desc">Backend, data and AI agent systems. Models, APIs and data flow into an orchestrator that ships them to three projects: AI Radar, Mundial 2026 and NotarTrack.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F1117"/>
      <stop offset="1" stop-color="#171A23"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#20242f"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset=".35" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="360" fill="url(#fade)"/></mask>
    <!-- userSpaceOnUse: a horizontal path has a zero-height bounding box, which
         would collapse a bbox-relative filter region and hide the packet. -->
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1200" height="360">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComponentTransfer in="blur" result="soft"><feFuncA type="linear" slope=".9"/></feComponentTransfer>
      <feMerge><feMergeNode in="soft"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .packet { stroke-dasharray: 10 200; stroke-dashoffset: 10; }
    .packet.in { animation: flowIn 5.4s linear infinite; }
    .packet.out { animation: flowOut 5.4s linear infinite; }
    @keyframes flowIn { 0% { stroke-dashoffset: 10; } 11.7% { stroke-dashoffset: -100; } 100% { stroke-dashoffset: -100; } }
    @keyframes flowOut { 0% { stroke-dashoffset: 10; } 13.3% { stroke-dashoffset: -100; } 100% { stroke-dashoffset: -100; } }
    .ring { opacity: 0; transform-box: fill-box; transform-origin: center; animation: arrive 5.4s ease-out infinite; }
    @keyframes arrive { 0%, 12.8% { opacity: 0; transform: scale(1); } 13.8% { opacity: .95; transform: scale(1); } 35.3% { opacity: 0; transform: scale(1.8); } 100% { opacity: 0; transform: scale(1.8); } }
    .hub-pulse { opacity: 0; transform-box: fill-box; transform-origin: center; animation: emit 1.8s ease-out infinite; animation-delay: -1.17s; }
    @keyframes emit { 0% { opacity: .85; transform: scale(1); } 60% { opacity: 0; transform: scale(1.5); } 100% { opacity: 0; transform: scale(1.5); } }
    .mini-sweep { animation: spin 3s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .reveal { animation: reveal .9s ease-out backwards; }
    @keyframes reveal { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .packet, .ring, .hub-pulse { animation: none; display: none; }
      .mini-sweep, .reveal { animation: none; }
    }
  </style>

  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="url(#bg)" stroke="#262B38"/>
  <rect x="0" y="0" width="1200" height="360" fill="url(#grid)" mask="url(#gridMask)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text class="reveal" x="72" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#6e8bff" style="animation-delay:.1s">~/riverbrdev</text>
    <text class="reveal" x="72" y="178" font-size="54" font-weight="700" letter-spacing="-1" fill="#E6E9F0" style="animation-delay:.25s">Bernardo Rios Tapia</text>
    <text class="reveal" x="72" y="222" font-size="23" font-weight="600" fill="#42e1b3" style="animation-delay:.45s">Backend, data and AI agent systems</text>
    <text class="reveal" x="72" y="258" font-size="17" fill="#8A92A6" style="animation-delay:.6s">Systems Engineering student in Cochabamba, Bolivia</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <path d="M686.0 112.0 Q736.1 127.7 776.8 161.0" fill="none" stroke="#2c3242" stroke-width="1.5"/><path d="M686.0 180.0 Q729.0 180.0 772.0 180.0" fill="none" stroke="#2c3242" stroke-width="1.5"/><path d="M686.0 248.0 Q736.1 232.3 776.8 199.0" fill="none" stroke="#2c3242" stroke-width="1.5"/><path d="M847.0 160.6 Q895.6 117.6 957.9 99.0" fill="none" stroke="#2c3242" stroke-width="1.5"/><path d="M852.0 180.0 Q913.0 180.0 974.0 180.0" fill="none" stroke="#2c3242" stroke-width="1.5"/><path d="M847.0 199.4 Q895.6 242.4 957.9 261.0" fill="none" stroke="#2c3242" stroke-width="1.5"/>
    <rect x="614" y="98" width="72" height="28" rx="14" fill="#141821" stroke="#2c3242" stroke-width="1.2"/><text x="650" y="116.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8A92A6">models</text><rect x="614" y="166" width="72" height="28" rx="14" fill="#141821" stroke="#2c3242" stroke-width="1.2"/><text x="650" y="184.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8A92A6">APIs</text><rect x="614" y="234" width="72" height="28" rx="14" fill="#141821" stroke="#2c3242" stroke-width="1.2"/><text x="650" y="252.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8A92A6">data</text>
    <path class="packet in" pathLength="100" d="M686.0 112.0 Q736.1 127.7 776.8 161.0" fill="none" stroke="#b7c4ff" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" style="animation-delay:-5.40s"/><path class="packet in" pathLength="100" d="M686.0 180.0 Q729.0 180.0 772.0 180.0" fill="none" stroke="#b7c4ff" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" style="animation-delay:-3.60s"/><path class="packet in" pathLength="100" d="M686.0 248.0 Q736.1 232.3 776.8 199.0" fill="none" stroke="#b7c4ff" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" style="animation-delay:-1.80s"/><path class="packet out" pathLength="100" d="M847.0 160.6 Q895.6 117.6 957.9 99.0" fill="none" stroke="#42e1b3" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" style="animation-delay:-4.77s"/><path class="packet out" pathLength="100" d="M852.0 180.0 Q913.0 180.0 974.0 180.0" fill="none" stroke="#ffb960" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" style="animation-delay:-2.97s"/><path class="packet out" pathLength="100" d="M847.0 199.4 Q895.6 242.4 957.9 261.0" fill="none" stroke="#6e8bff" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)" style="animation-delay:-1.17s"/>
    <polygon class="hub-pulse" points="812.0,146.0 841.4,163.0 841.4,197.0 812.0,214.0 782.6,197.0 782.6,163.0" fill="none" stroke="#b7c4ff" stroke-width="2"/>
    <polygon points="812.0,146.0 841.4,163.0 841.4,197.0 812.0,214.0 782.6,197.0 782.6,163.0" fill="#141821" stroke="#b7c4ff" stroke-width="2"/>
    <polygon points="812.0,167.0 823.3,173.5 823.3,186.5 812.0,193.0 800.7,186.5 800.7,173.5" fill="#b7c4ff"/>
    <text x="812" y="238" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#8A92A6">orchestrator</text>
    <circle class="ring" cx="985" cy="84" r="25" fill="none" stroke="#42e1b3" stroke-width="2" style="animation-delay:-4.77s"/><circle cx="985" cy="84" r="25" fill="#141821" stroke="#42e1b3" stroke-opacity=".6" stroke-width="1.5"/><circle cx="985" cy="84" r="13" fill="none" stroke="#42e1b3" stroke-opacity=".5"/><circle cx="985" cy="84" r="6" fill="none" stroke="#42e1b3" stroke-opacity=".35"/><g class="mini-sweep" style="transform-origin:985px 84px"><path d="M985 84 L985.0 71.0 A13 13 0 0 0 974.4 76.5 Z" fill="#42e1b3" fill-opacity=".45"/><line x1="985" y1="84" x2="985.0" y2="71.0" stroke="#42e1b3" stroke-width="1.5"/></g><circle class="ring" cx="1005" cy="180" r="25" fill="none" stroke="#ffb960" stroke-width="2" style="animation-delay:-2.97s"/><circle cx="1005" cy="180" r="25" fill="#141821" stroke="#ffb960" stroke-opacity=".6" stroke-width="1.5"/><line x1="1005.0" y1="170.0" x2="1013.7" y2="185.0" stroke="#ffb960" stroke-opacity=".55" stroke-width="1.4"/><line x1="1013.7" y1="185.0" x2="996.3" y2="185.0" stroke="#ffb960" stroke-opacity=".55" stroke-width="1.4"/><line x1="996.3" y1="185.0" x2="1005.0" y2="170.0" stroke="#ffb960" stroke-opacity=".55" stroke-width="1.4"/><circle cx="1005.0" cy="170.0" r="3.2" fill="#ffb960"/><circle cx="1013.7" cy="185.0" r="3.2" fill="#ffb960"/><circle cx="996.3" cy="185.0" r="3.2" fill="#ffb960"/><circle class="ring" cx="985" cy="276" r="25" fill="none" stroke="#6e8bff" stroke-width="2" style="animation-delay:-1.17s"/><circle cx="985" cy="276" r="25" fill="#141821" stroke="#6e8bff" stroke-opacity=".6" stroke-width="1.5"/><rect x="977" y="265" width="16" height="22" rx="2.5" fill="none" stroke="#6e8bff" stroke-width="1.6"/><path d="M981 277 l3 3 l6 -7" fill="none" stroke="#6e8bff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1024" y="82" font-size="16" font-weight="700" fill="#E6E9F0">AI Radar</text><text x="1024" y="100" font-size="12.5" fill="#8A92A6">trend detection</text><text x="1044" y="178" font-size="16" font-weight="700" fill="#E6E9F0">Mundial 2026</text><text x="1044" y="196" font-size="12.5" fill="#8A92A6">agent simulation</text><text x="1024" y="274" font-size="16" font-weight="700" fill="#E6E9F0">NotarTrack</text><text x="1024" y="292" font-size="12.5" fill="#8A92A6">SaaS for notaries</text>
  </g>
</svg>
